<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 북마크 관리자</title>
  <!-- 홈 화면에 추가(설치)와 오프라인용. 경로는 모두 상대 경로 (D-023) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#2563eb">
  <style>
    /* 라이트 테마 변수 */
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08);
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
      --input-bg: #ffffff;
      --drag-border: #2563eb;
      --radius: 12px;
    }

    /* 다크 테마 변수 */
    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --danger: #ef4444;
      --danger-bg: #451a1a;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
      --badge-bg: #075985;
      --badge-text: #e0f2fe;
      --input-bg: #0f172a;
      --drag-border: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; }
    .container { max-width: 1080px; margin: 0 auto; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .account-label { font-size: 0.8rem; color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 누르면 삭제 기록 비우기 (D-025). 버튼이지만 글자처럼 보이게 한다 */
    button.sync-status { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; background: none; padding: 4px 6px; }
    button.sync-status:hover:not(:disabled) { background: var(--border); }
    .sync-status.is-offline { color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    /* button의 display 지정이 hidden 속성을 덮지 않도록 */
    [hidden] { display: none !important; }

    /* Buttons */
    button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 500; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover:not(:disabled) { background: var(--border); }
    .btn-icon { padding: 8px 10px; font-size: 1.1rem; }

    /* Controls */
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--input-bg); color: var(--text); }
    .filter-select { padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--input-bg); color: var(--text); cursor: pointer; }
    .search-box:focus, .filter-select:focus { outline: 2px solid var(--primary); }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: grab;
      user-select: none;
    }
    .card:active { cursor: grabbing; }
    .card[draggable="false"] { cursor: default; }

    /* Drag & Drop Visual State */
    .card.dragging { opacity: 0.35; transform: scale(0.98); }
    .card.drag-over { border: 2px dashed var(--drag-border); transform: translateY(-4px); }

    .card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .drag-handle { color: var(--text-muted); font-size: 1.1rem; line-height: 1; cursor: grab; padding-top: 2px; }
    .favicon { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; flex-shrink: 0; }
    .title-wrapper { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; text-decoration: none; color: var(--text); font-size: 1rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-title:hover { color: var(--primary); }
    .card-url { font-size: 0.8rem; color: var(--text-muted); margin: 6px 0 10px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .badge { display: inline-block; background: var(--badge-bg); color: var(--badge-text); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .card-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .btn-action { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }
    .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
    .move-group { display: flex; gap: 6px; margin-right: auto; }
    .btn-delete { color: var(--danger); background: var(--danger-bg); }
    .btn-delete:hover { filter: brightness(0.9); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); display: none; justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow); }
    .modal h2 { margin-bottom: 16px; font-size: 1.25rem; font-weight: 600; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--input-bg); color: var(--text); }
    .form-group input:focus { outline: 2px solid var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔖 북마크 매니저</h1>
    <div class="btn-group">
      <button type="button" id="syncStatus" class="sync-status" onclick="cleanTombstones()" hidden></button>
      <span id="accountLabel" class="account-label" hidden></span>
      <!-- Firebase를 불러온 뒤에만 보인다 (로컬 모드에서는 숨김) -->
      <button class="btn-outline" id="authBtn" onclick="toggleAuth()" hidden>🔑 로그인</button>
      <button class="btn-outline btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="테마 전환">🌙</button>
      <!-- 계정이 준비되기 전에는 비활성화 (K-16, D-025). data-requires-list: 보이는 목록이 없을 때만, data-requires-account: 목록을 바꾸므로 준비될 때까지 -->
      <button class="btn-outline" onclick="exportHTML()" title="브라우저에서 바로 가져올 수 있는 HTML로 내보내기" data-requires-list>🌐 HTML 내보내기</button>
      <button class="btn-outline" onclick="exportJSON()" title="전체 백업 JSON 다운로드" data-requires-list>💾 JSON 백업</button>
      <button class="btn-outline" onclick="document.getElementById('fileInput').click()" title="JSON 백업 복구 또는 브라우저에서 내보낸 북마크 HTML 가져오기" data-requires-account>📂 가져오기</button>
      <input type="file" id="fileInput" accept=".json,.html,.htm" style="display:none" onchange="importJSON(event)">
      <button class="btn-primary" onclick="openModal()" data-requires-account>+ 북마크 추가</button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="제목 또는 웹 주소 검색..." oninput="renderBookmarks()">
    <select id="categoryFilter" class="filter-select" onchange="renderBookmarks()">
      <option value="all">전체 카테고리</option>
    </select>
  </div>

  <div id="bookmarkGrid" class="grid"></div>
</div>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
  <form class="modal" id="bookmarkForm" onsubmit="event.preventDefault(); saveBookmark()">
    <h2 id="modalTitle">새 북마크 추가</h2>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label for="bmTitle">이름 / 사이트명</label>
      <input type="text" id="bmTitle" required maxlength="500" placeholder="예: 네이버">
    </div>
    <div class="form-group">
      <label for="bmUrl">URL (웹 주소)</label>
      <!-- type="url"은 스킴 없는 주소(example.com)를 막으므로 text로 두고 saveBookmark에서 보정·검증한다 (D-011) -->
      <input type="text" inputmode="url" id="bmUrl" required maxlength="2048" placeholder="https://example.com">
    </div>
    <div class="form-group">
      <label for="bmCategory">카테고리</label>
      <input type="text" id="bmCategory" maxlength="100" placeholder="예: 업무, 포털, 개발 도구">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-outline" onclick="closeModal()">취소</button>
      <button type="submit" class="btn-primary">저장하기</button>
    </div>
  </form>
</div>

<!-- 배포별 설정(선택). 없거나 비어 있으면 기본 설정을 쓴다 (D-026) -->
<script src="config.js"></script>
<script>
  const STORAGE_KEY = 'single_file_bookmarks_v3';
  const LEGACY_STORAGE_KEY = 'single_file_bookmarks_v2'; // v0.3 이하 형식 (addedAt 없음)
  const THEME_KEY = 'single_file_bookmarks_theme';
  const MIN_PLAUSIBLE_TIME = Date.UTC(2000, 0, 1);
  // Firestore 규칙(firestore.rules)과 같은 제한. 다르면 앱에서는 저장됐는데 서버가 거부한다.
  const MAX_TITLE_LENGTH = 500;
  const MAX_URL_LENGTH = 2048;
  const MAX_CATEGORY_LENGTH = 100;
  const MIGRATED_KEY_PREFIX = 'single_file_bookmarks_migrated_'; // + uid. 첫 로그인 이전을 물었는지
  const CLOUD_HINT_KEY = 'single_file_bookmarks_cloud_uid'; // 로그인한 채로 닫았는지 (K-16)
  const CLOUD_COPY_KEY_PREFIX = 'single_file_bookmarks_cloud_copy_'; // + uid. 계정 목록의 사본 (D-025)
  const CLOUD_COPY_VERSION = 1;

  // 기본 Firebase 설정. config.js가 없거나 설정하지 않았으면 이 값을 쓴다 (D-026).
  // 공개돼도 되는 값이다(비밀 키 아님). 데이터는 보안 규칙과 승인된 도메인으로 보호한다.
  const DEFAULT_FIREBASE_CONFIG = {
    apiKey: 'AIzaSyCIJO3SO5JDv7TNP2PIcu1O601zR45Pl60',
    authDomain: 'jdrbmmanager.firebaseapp.com',
    projectId: 'jdrbmmanager',
    storageBucket: 'jdrbmmanager.firebasestorage.app',
    messagingSenderId: '423101234193',
    appId: '1:423101234193:web:0c2c371bc1513695bf85b0'
  };
  const FIREBASE_REQUIRED_KEYS = ['apiKey', 'authDomain', 'projectId', 'appId'];
  const FIREBASE_CONFIG = resolveFirebaseConfig(); // null이면 클라우드 끔
  // 버전을 고정한다. 올릴 때는 세 파일이 같은 버전이어야 한다.
  const FIREBASE_SDK_URL = 'https://www.gstatic.com/firebasejs/12.19.0/';

  const DEFAULT_BOOKMARKS = [
    { id: 1, title: 'Google', url: 'https://www.google.com', category: '검색', addedAt: null },
    { id: 2, title: 'GitHub', url: 'https://github.com', category: '개발', addedAt: null },
    { id: 3, title: 'YouTube', url: 'https://www.youtube.com', category: '미디어', addedAt: null }
  ];

  // 로그인한 채로 닫았으면 Firebase를 불러오는 동안 로컬 목록 대신 계정 목록의 사본을 보인다(없으면 "불러오는 중").
  // 그 사이에 로컬 목록을 보고 고치면 계정이 아닌 로컬 목록에 저장되기 때문이다 (K-16).
  // 계정이 준비될 때까지 목록을 바꾸는 조작은 막는다 (D-025).
  // 로그인한 채로 닫은 뒤 클라우드를 껐으면 handleAuthChange가 실행되지 않아 사본이 남으므로 여기서 지운다 (D-026).
  if (!canUseCloud()) forgetCloudCopy();
  let cloudLoading = canUseCloud() && localStorage.getItem(CLOUD_HINT_KEY) !== null;
  const bootCopy = cloudLoading ? loadCloudCopy(localStorage.getItem(CLOUD_HINT_KEY)) : null;
  let bookmarks = cloudLoading ? (bootCopy ? bootCopy.items : []) : loadBookmarks();
  let store = createLocalStore();

  /* ------------- 데이터 검증 및 불러오기 ------------- */
  // localStorage와 가져온 JSON은 모두 외부 입력으로 보고 여기서 검증한다.
  function isSafeUrl(url) {
    try {
      const protocol = new URL(url).protocol;
      return protocol === 'http:' || protocol === 'https:';
    } catch {
      return false;
    }
  }

  function isPlausibleTime(time) {
    return Number.isSafeInteger(time) && time >= MIN_PLAUSIBLE_TIME && time <= Date.now() + 86400000;
  }

  // 넘는 제목·카테고리는 항목을 버리지 않고 자른다 (기존 데이터를 잃지 않도록).
  function truncateText(text, maxLength) {
    if (text.length <= maxLength) return text;
    const cut = text.slice(0, maxLength);
    // 서로게이트 쌍(이모지 등) 가운데에서 잘리지 않게 한다.
    return /[\uD800-\uDBFF]$/.test(cut) ? cut.slice(0, -1) : cut;
  }

  function normalizeBookmark(item) {
    if (!item || typeof item !== 'object') return null;
    const title = typeof item.title === 'string' ? truncateText(item.title.trim(), MAX_TITLE_LENGTH) : '';
    const url = typeof item.url === 'string' ? item.url.trim() : '';
    // 주소는 자르면 다른 주소가 되므로 너무 길면 항목을 버린다.
    if (!title || !isSafeUrl(url) || url.length > MAX_URL_LENGTH) return null;

    const rawId = Number(item.id);
    const id = Number.isSafeInteger(rawId) && rawId > 0 ? rawId : null; // null이면 sanitizeBookmarks에서 새로 발급
    const addedAt = Number(item.addedAt);
    return {
      id,
      title,
      url,
      category: typeof item.category === 'string' ? truncateText(item.category.trim(), MAX_CATEGORY_LENGTH) : '',
      // v0.3 이하 데이터에는 addedAt 필드가 없다. 그때는 ID가 생성 시각(Date.now())이었으므로 ID로 추정한다.
      addedAt: item.addedAt === undefined
        ? (isPlausibleTime(id) ? id : null)
        : (isPlausibleTime(addedAt) ? addedAt : null)
    };
  }

  function maxId(list) {
    return list.reduce((max, bm) => Math.max(max, bm.id || 0), 0);
  }

  // 두 기기가 오프라인에서 같은 ID를 만들지 않도록 ms 시각에 난수 세 자리를 붙인다 (D-003).
  // 가져온 ID가 더 클 수 있어 최대값 이후로 발급한다. 2255년까지 안전한 정수 범위.
  function generateId(currentMaxId) {
    return Math.max(Date.now() * 1000 + Math.floor(Math.random() * 1000), currentMaxId + 1);
  }

  // 잘못된 항목은 버리고, ID가 없거나 이미 쓰인(기존 목록 또는 앞선 항목) ID에는 겹치지 않는 새 ID를 준다.
  function sanitizeBookmarks(list, existing = []) {
    const items = list.map(normalizeBookmark).filter(Boolean);
    const usedIds = new Set(existing.map(bm => bm.id));
    let nextId = generateId(Math.max(maxId(existing), maxId(items)));
    items.forEach(bm => {
      if (bm.id === null || usedIds.has(bm.id)) bm.id = nextId++;
      usedIds.add(bm.id);
    });
    return items;
  }

  // 키가 없으면 null, 손상됐으면 시드 데이터를 돌려준다.
  function readStoredBookmarks(key) {
    const saved = localStorage.getItem(key);
    if (saved === null) return null;

    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) return sanitizeBookmarks(parsed);
    } catch {
      // 아래에서 처리
    }

    // 손상된 데이터는 다음 저장 때 덮어쓰이기 전에 별도 키에 보관한다.
    localStorage.setItem(key + '_broken', saved);
    return copyDefaultBookmarks();
  }

  // 작업 함수가 bookmarks 배열을 직접 바꾸므로 시드 상수를 그대로 넘기면 상수가 바뀐다 (K-15).
  function copyDefaultBookmarks() {
    return DEFAULT_BOOKMARKS.map(bm => ({ ...bm }));
  }

  function loadBookmarks() {
    const current = readStoredBookmarks(STORAGE_KEY);
    if (current) return current;

    // 이전 형식에서 옮긴다. 되돌아갈 수 있도록 이전 키는 지우지 않는다.
    const legacy = readStoredBookmarks(LEGACY_STORAGE_KEY);
    if (legacy) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(legacy));
      return legacy;
    }
    return copyDefaultBookmarks();
  }

  // 계정 목록의 사본 { version, lastSync, lastFullSync, items: [{ ...북마크, order }] } (D-025).
  // 사본도 외부 입력이다. 한 항목이라도 잘못됐으면 사본 전체를 버려 서버에서 전체를 다시 받게 한다
  // (항목만 버리면 그 북마크가 다음 전체 동기화까지 빠진 채로 남는다).
  function loadCloudCopy(uid) {
    try {
      const copy = JSON.parse(localStorage.getItem(CLOUD_COPY_KEY_PREFIX + uid));
      if (!copy || copy.version !== CLOUD_COPY_VERSION || !Array.isArray(copy.items)
        || !Number.isFinite(copy.lastSync) || !Number.isFinite(copy.lastFullSync)) return null;
      const orders = new Map();
      const items = [];
      for (const raw of copy.items) {
        const bm = normalizeBookmark(raw);
        if (!bm || bm.id === null || orders.has(bm.id) || !Number.isFinite(raw.order)) return null;
        orders.set(bm.id, raw.order);
        items.push(bm);
      }
      return { lastSync: copy.lastSync, lastFullSync: copy.lastFullSync, items, orders };
    } catch {
      return null;
    }
  }

  /* ------------- 저장소 및 상태 작업 ------------- */
  // store 메서드는 작업 함수가 메모리 배열을 바꾼 뒤에 호출된다:
  // add(item), update(id, fields), remove(id), move(id, toIndex), replaceAll(list), mergeAll(list)
  // LocalStore는 어떤 변경이든 배열 전체를 저장하고, 클라우드 저장소는 바뀐 항목만 쓴다 (D-020).
  function createLocalStore() {
    function saveAll() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
    }
    return { add: saveAll, update: saveAll, remove: saveAll, move: saveAll, replaceAll: saveAll, mergeAll: saveAll };
  }

  // bookmarks를 바꾸는 유일한 경로. 메모리 배열을 바꾸고, 다시 그린 뒤, 저장을 store에 맡긴다.
  function addBookmark(item) {
    bookmarks.unshift(item); // 새 북마크는 맨 앞 (D-004)
    renderBookmarks();
    store.add(item);
  }

  function updateBookmark(id, fields) {
    const idx = bookmarks.findIndex(bm => bm.id === id);
    if (idx === -1) return;
    bookmarks[idx] = { ...bookmarks[idx], ...fields };
    renderBookmarks();
    store.update(id, fields);
  }

  function removeBookmark(id) {
    bookmarks = bookmarks.filter(bm => bm.id !== id);
    renderBookmarks();
    store.remove(id);
  }

  // toIndex는 옮긴 뒤 전체 배열에서의 위치 (= 옮기기 전 대상 카드의 위치)
  function moveBookmark(id, toIndex) {
    const fromIndex = bookmarks.findIndex(bm => bm.id === id);
    if (fromIndex === -1 || fromIndex === toIndex || toIndex < 0 || toIndex >= bookmarks.length) return;
    const [movedItem] = bookmarks.splice(fromIndex, 1);
    bookmarks.splice(toIndex, 0, movedItem);
    renderBookmarks();
    store.move(id, toIndex);
  }

  function replaceAll(list) {
    bookmarks = list;
    renderBookmarks();
    store.replaceAll(list);
  }

  // list는 기존 목록과 ID가 겹치지 않게 sanitizeBookmarks(list, bookmarks)를 거친 것이어야 한다.
  function mergeAll(list) {
    bookmarks = [...list, ...bookmarks];
    renderBookmarks();
    store.mergeAll(list);
  }

  /* ------------- 로그인 및 클라우드 동기화 ------------- */
  // 로그인하면 store를 CloudStore로 바꾸고 Firestore 목록을 보여 준다. 로그아웃하면 localStorage의 로컬 목록으로 돌아간다.
  // file://로 열었거나 Firebase를 불러오지 못하면 로그인 버튼 없이 로컬 모드로만 동작한다 (D-019).
  const ORDER_GAP = 1024;
  const MIN_ORDER_GAP = 1e-6;
  const MAX_BATCH_WRITES = 500;
  const DAY_MS = 86400000;
  // 바뀐 것만 받으면 문서가 직접 지워진 경우(v0.6 이하 앱, 콘솔)를 놓치므로 이 주기로 전체를 다시 받는다 (D-025).
  const FULL_SYNC_INTERVAL_DAYS = 7;
  // 이보다 오래된 묘비만 비운다. 전체 동기화 주기 + 1일이면 어느 기기도 삭제를 놓치지 않는다 (주기를 바꾸면 함께 바꾼다).
  const TOMBSTONE_KEEP_DAYS = FULL_SYNC_INTERVAL_DAYS + 1;
  const TOMBSTONE_BYTES = 150; // 묘비 1개의 대략적인 저장 공간 (색인 포함 추정)

  let firebase = null; // { app, auth, authApi, fs }
  let cloud = null;    // 로그인 중일 때 { uid, db, unsubscribe, migrationChecked, ... }
  let lastWriteErrorAt = 0;
  // 연결이 불안정해 SDK가 끝없이 받아지는 동안 "불러오는 중"에 갇히지 않도록
  const SDK_LOAD_TIMEOUT_MS = 10000;
  const SERVER_FETCH_TIMEOUT_MS = 10000;

  // config.js의 window.APP_CONFIG로 쓸 설정을 정한다 (D-026). null이면 클라우드 끔.
  // 형식이 틀리면 기본 프로젝트에 조용히 붙지 않도록 클라우드를 끈다.
  function resolveFirebaseConfig() {
    const appConfig = window.APP_CONFIG;
    if (appConfig === undefined && !isAppConfigDeclared()) return DEFAULT_FIREBASE_CONFIG;
    if (appConfig !== null && typeof appConfig === 'object' && !Array.isArray(appConfig)) {
      if (!('firebase' in appConfig)) return DEFAULT_FIREBASE_CONFIG;
      const config = appConfig.firebase;
      if (config === null) return null;
      if (typeof config === 'object' && !Array.isArray(config) &&
          FIREBASE_REQUIRED_KEYS.every(key => typeof config[key] === 'string' && config[key] !== '')) {
        return { ...config };
      }
    }
    console.warn(`config.js의 설정 형식이 올바르지 않아 로컬 모드로 동작합니다. window.APP_CONFIG = { firebase: { ${FIREBASE_REQUIRED_KEYS.join(', ')}, … } } 형태로 대입해야 합니다.`);
    return null;
  }

  // config.js에서 const·let APP_CONFIG로 선언하면 window의 속성이 되지 않아 읽히지 않는다(조용히 기본 설정이 되지 않게 형식 오류로 본다).
  // 선언 도중 오류가 나 초기화되지 않은 이름은 typeof도 예외를 던지므로 try로 감싼다.
  function isAppConfigDeclared() {
    try {
      return typeof APP_CONFIG !== 'undefined';
    } catch {
      return true;
    }
  }

  // http(s)로 열었는지. 서비스 워커는 클라우드 설정과 관계없이 이것만 본다.
  function isServedOverHttp() {
    return location.protocol === 'http:' || location.protocol === 'https:';
  }

  function canUseCloud() {
    return isServedOverHttp() && FIREBASE_CONFIG !== null;
  }

  // hasList: 계정 목록(사본)이 보이고 있으면 내보내기는 허용한다.
  function setCloudLoading(on, hasList = false) {
    cloudLoading = on;
    document.querySelectorAll('[data-requires-account]').forEach(button => { button.disabled = on; });
    document.querySelectorAll('[data-requires-list]').forEach(button => { button.disabled = on && !hasList; });
  }

  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((resolve, reject) =>
      setTimeout(() => reject(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))]);
  }

  // 올릴 쓰기가 ms 안에 모두 서버에 올라갔는지. 오프라인이면 끝나지 않으므로 시간을 제한한다.
  function waitForSync(db, ms) {
    return Promise.race([
      firebase.fs.waitForPendingWrites(db).then(() => true, () => true),
      new Promise(resolve => setTimeout(() => resolve(false), ms))
    ]);
  }

  // 계정 목록을 기다리다 포기할 때(SDK 실패, 로그인 풀림) 로컬 목록을 보인다.
  function showLocalListIfLoading() {
    if (!cloudLoading) return;
    setCloudLoading(false);
    bookmarks = loadBookmarks();
    renderBookmarks();
  }

  async function initCloud() {
    if (!canUseCloud()) return;
    try {
      // 정적 import는 실패하면 스크립트 전체가 멈추므로 동적 import로 불러온다.
      const timeout = new Promise((resolve, reject) => setTimeout(() => reject(new Error('timeout')), SDK_LOAD_TIMEOUT_MS));
      const [appApi, authApi, fs] = await Promise.race([Promise.all(
        ['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(file => import(FIREBASE_SDK_URL + file))), timeout]);
      const app = appApi.initializeApp(FIREBASE_CONFIG);
      firebase = { app, auth: authApi.getAuth(app), authApi, fs };
    } catch (err) {
      console.warn('Firebase를 불러오지 못해 로컬 모드로 동작합니다.', err);
      showLocalListIfLoading();
      return;
    }
    // 리디렉트 로그인은 앱 주소가 authDomain과 같을 때만 쓴다 (D-021).
    if (location.hostname === FIREBASE_CONFIG.authDomain) {
      firebase.authApi.getRedirectResult(firebase.auth).catch(err => console.warn(err));
    }
    firebase.authApi.onAuthStateChanged(firebase.auth, handleAuthChange);
  }

  function handleAuthChange(user) {
    if (cloud && (!user || user.uid !== cloud.uid)) leaveCloudMode();
    if (user && !cloud) enterCloudMode(user);
    if (!user) {
      // 로그인한 채로 닫았지만 로그인이 풀려 있는 경우(만료 등). 로그아웃과 같이 사본도 지운다 (D-025).
      forgetCloudCopy();
      showLocalListIfLoading();
    }
    updateAuthUi(user);
  }

  // 로그인한 채로 닫았다는 표시와 그 계정의 사본을 지운다. 사본은 올릴 변경의 대기열이 아니라서 잃는 데이터가 없다.
  function forgetCloudCopy() {
    const hintUid = localStorage.getItem(CLOUD_HINT_KEY);
    if (hintUid) localStorage.removeItem(CLOUD_COPY_KEY_PREFIX + hintUid);
    localStorage.removeItem(CLOUD_HINT_KEY);
  }

  function updateSyncStatus() {
    const status = document.getElementById('syncStatus');
    status.hidden = !cloud;
    if (!cloud) return;
    const offline = !navigator.onLine;
    status.classList.toggle('is-offline', offline);
    if (offline) {
      status.textContent = cloud.pending ? '⚠ 오프라인 · 올릴 변경 있음' : '⚠ 오프라인';
      status.title = '연결되면 자동으로 동기화됩니다';
    } else if (cloud.pending) {
      status.textContent = '⬆ 올릴 변경 있음';
      status.title = '서버에 올리는 중입니다';
    } else if (cloud.fromCache) {
      status.textContent = '… 연결 중';
      status.title = '서버와 연결하는 중입니다. 그동안의 변경은 연결되면 올라갑니다';
    } else {
      status.textContent = '✓ 동기화됨';
      status.title = '모든 변경이 서버에 저장됐습니다';
    }
    status.title += '\n눌러서 삭제 기록 관리';
  }

  // 아직 서버에 올라가지 않은 쓰기가 있는지 본다. 오프라인에서 다시 연 경우처럼 이전 세션의 쓰기도 포함된다.
  function watchPendingWrites() {
    const session = cloud;
    if (!session) return;
    const generation = ++session.pendingGeneration;
    // 온라인에서는 금방 끝나므로 1초가 지나도 남아 있을 때만 표시한다 (깜박임 방지).
    const timer = setTimeout(() => {
      if (cloud !== session || generation !== session.pendingGeneration) return;
      session.pending = true;
      updateSyncStatus();
    }, 1000);
    firebase.fs.waitForPendingWrites(session.db).then(() => {
      clearTimeout(timer);
      if (cloud !== session || generation !== session.pendingGeneration) return;
      session.pending = false;
      updateSyncStatus();
    }, () => clearTimeout(timer));
  }

  function updateAuthUi(user) {
    const label = document.getElementById('accountLabel');
    const button = document.getElementById('authBtn');
    label.textContent = user ? (user.email || user.displayName || '') : '';
    label.title = label.textContent;
    label.hidden = !user;
    button.textContent = user ? '로그아웃' : '🔑 로그인';
    button.title = user ? '로그아웃하면 이 기기의 로컬 목록으로 돌아갑니다' : 'Google 계정으로 로그인해 여러 기기에서 동기화';
    button.hidden = false;
  }

  function toggleAuth() {
    if (!firebase) return;
    if (cloud) logout();
    else login();
  }

  async function login() {
    const { authApi, auth } = firebase;
    const provider = new authApi.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await authApi.signInWithPopup(auth, provider);
    } catch (err) {
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
      if (err.code === 'auth/popup-blocked' && location.hostname === FIREBASE_CONFIG.authDomain) {
        authApi.signInWithRedirect(auth, provider);
        return;
      }
      alert(err.code === 'auth/popup-blocked'
        ? '로그인 창이 차단됐습니다. 브라우저에서 이 사이트의 팝업을 허용해 주세요.'
        : `로그인하지 못했습니다.\n(${err.code || err.message})`);
    }
  }

  // 로그아웃하면 클라우드 캐시를 지우므로, 아직 올라가지 않은 변경이 있으면 먼저 묻는다.
  async function logout() {
    const button = document.getElementById('authBtn');
    button.disabled = true;
    const synced = await waitForSync(cloud.db, 3000);
    button.disabled = false;
    if (!synced && !confirm('아직 서버에 올라가지 않은 변경이 있습니다 (오프라인일 수 있음).\n로그아웃하면 이 변경은 사라집니다. 계속할까요?')) return;
    firebase.authApi.signOut(firebase.auth);
  }

  function enterCloudMode(user) {
    const { fs } = firebase;
    // 오프라인에서도 읽고 쓸 수 있도록 IndexedDB 캐시를 쓴다. 여러 탭에서 열어도 된다.
    const db = fs.initializeFirestore(firebase.app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    const copy = loadCloudCopy(user.uid);
    const session = {
      uid: user.uid, db, unsubscribe: null, migrationChecked: false,
      fromCache: true, pending: false, pendingGeneration: 0
    };
    const cloudStore = createCloudStore(db, user.uid, copy);
    cloud = session;
    store = cloudStore;
    localStorage.setItem(CLOUD_HINT_KEY, user.uid);
    // 준비되기 전에 목록을 바꿔 클라우드에 쓰지 않도록 막는다. 사본이 있으면 바로 보이고, 없으면 "불러오는 중".
    setCloudLoading(true, copy !== null);
    bookmarks = copy ? copy.items : [];
    renderBookmarks();
    updateSyncStatus();
    watchPendingWrites();
    startCloudSync(session, cloudStore, copy !== null);
  }

  // 사본이 없거나 전체 동기화 주기가 지났으면 전체를 받고, 그 뒤로는 바뀐 문서만 구독한다 (D-025).
  async function startCloudSync(session, cloudStore, hasCopy) {
    let fullSynced = false;
    if (!hasCopy || cloudStore.isFullSyncDue()) {
      // 사본이 있으면 확정 안 된 쓰기가 없을 때만 전체로 바꾼다. 아니면 방금 쓴 항목이 잠시 사라진다. 못 하면 다음에 열 때.
      const canReplace = !hasCopy || (navigator.onLine && await waitForSync(session.db, 3000));
      if (cloud !== session) return;
      if (canReplace) {
        try {
          const list = await cloudStore.fetchAll();
          if (cloud !== session) return;
          bookmarks = list;
          renderBookmarks();
          cloudStore.saveCopy();
          session.fromCache = false;
          fullSynced = true;
        } catch (err) {
          if (cloud !== session) return;
          if (err.code === 'permission-denied') {
            handleCloudError(err);
            return;
          }
          console.warn('서버에서 전체 목록을 받지 못했습니다.', err);
          if (!hasCopy) {
            waitToRetrySync(session, cloudStore);
            return;
          }
        }
      }
    }

    session.unsubscribe = firebase.fs.onSnapshot(cloudStore.changesQuery(), { includeMetadataChanges: true }, snapshot => {
      showCloudList(cloudStore.applyChanges(snapshot));
      cloudStore.saveCopy();
      session.fromCache = snapshot.metadata.fromCache;
      updateSyncStatus();
      if (!snapshot.metadata.fromCache) checkMigration(session);
    }, handleCloudError);
    setCloudLoading(false);
    renderBookmarks(); // 카드의 수정·삭제·이동 버튼을 켠다
    updateSyncStatus();
    if (fullSynced) checkMigration(session);
  }

  // 사본 없이 서버에 닿지 못하면(오프라인 등) SDK 캐시에 남은 목록을 편집을 막은 채 보여 주고, 연결되면 다시 받는다.
  function waitToRetrySync(session, cloudStore) {
    cloudStore.readCache().then(list => {
      if (cloud === session && cloudLoading && list.length) {
        bookmarks = list;
        renderBookmarks();
      }
    }, () => {});
    let retried = false;
    const retry = () => {
      window.removeEventListener('online', retry);
      if (retried || cloud !== session) return;
      retried = true;
      startCloudSync(session, cloudStore, false);
    };
    window.addEventListener('online', retry);
    // 온라인인데 응답이 늦은 경우에는 online 이벤트가 오지 않는다.
    setTimeout(retry, 30000);
  }

  // 서버에서 받은 변경으로 목록을 바꾼다 (원격 변경의 경로. 이 기기의 변경은 작업 함수로 한다).
  // 내 기기의 쓰기는 이미 화면에 반영돼 있다. 같으면 다시 그리지 않아야 이동 버튼의 포커스가 유지된다.
  function showCloudList(list) {
    if (JSON.stringify(list) === JSON.stringify(bookmarks)) return;
    bookmarks = list;
    renderBookmarks();
  }

  // 서버 목록을 받은 뒤에야 클라우드가 비었는지 알 수 있다.
  function checkMigration(session) {
    if (session.migrationChecked) return;
    session.migrationChecked = true;
    offerLocalMigration(session.uid);
  }

  function handleCloudError(err) {
    console.error(err);
    alert(err.code === 'permission-denied'
      ? '이 계정은 북마크 데이터에 접근할 수 없습니다.\n(허용된 계정이 아니거나 보안 규칙이 게시되지 않았습니다.)\n로그아웃합니다.'
      : `클라우드 목록을 불러오지 못했습니다. 로그아웃합니다.\n(${err.code || err.message})`);
    firebase.authApi.signOut(firebase.auth);
  }

  function leaveCloudMode() {
    const { fs } = firebase;
    const { db, unsubscribe, uid } = cloud;
    if (unsubscribe) unsubscribe();
    store.close();
    // 공용 기기에서 로그아웃한 뒤 계정 목록이 남지 않도록 사본도 지운다 (D-025).
    localStorage.removeItem(CLOUD_COPY_KEY_PREFIX + uid);
    cloud = null;
    store = createLocalStore();
    localStorage.removeItem(CLOUD_HINT_KEY);
    setCloudLoading(false);
    bookmarks = loadBookmarks();
    renderBookmarks();
    updateSyncStatus();
    // 로그아웃하면 이 기기의 클라우드 캐시를 지운다 (D-019). 앱이 다른 탭에도 열려 있으면 실패할 수 있다.
    fs.terminate(db)
      .then(() => fs.clearIndexedDbPersistence(db))
      .catch(err => console.warn('클라우드 캐시를 지우지 못했습니다.', err));
  }

  // 첫 로그인 때 이 기기의 로컬 목록을 계정에 올릴지 기기마다 한 번 묻는다 (D-019).
  function offerLocalMigration(uid) {
    const key = MIGRATED_KEY_PREFIX + uid;
    if (localStorage.getItem(key)) return;
    // 묻기 전에 기록해 여러 탭에서 함께 묻지 않게 한다.
    localStorage.setItem(key, String(Date.now()));

    const local = loadBookmarks();
    if (local.length === 0 || isSeedOnly(local)) return;
    const question = bookmarks.length === 0
      ? `이 기기의 북마크 ${local.length}개를 계정에 올릴까요?`
      : `이 기기의 북마크 ${local.length}개를 계정 목록에 합칠까요?`;
    if (confirm(question + '\n(이 기기의 로컬 목록은 지워지지 않습니다.)')) {
      mergeAll(sanitizeBookmarks(local, bookmarks));
    }
  }

  function isSeedOnly(list) {
    return list.length === DEFAULT_BOOKMARKS.length && list.every(bm =>
      DEFAULT_BOOKMARKS.some(seed => seed.id === bm.id && seed.title === bm.title && seed.url === bm.url));
  }

  // 동기화 상태 표시를 누르면 삭제 기록(묘비) 수를 보이고, 오래된 것을 비울지 묻는다 (D-025).
  // 자동으로는 지우지 않는다. 최근 기록을 남기므로 어느 기기도 삭제를 놓치지 않는다.
  async function cleanTombstones() {
    const session = cloud;
    if (!session || cloudLoading) return;
    if (!navigator.onLine) {
      alert('연결된 뒤에 다시 시도해 주세요.');
      return;
    }
    const button = document.getElementById('syncStatus');
    button.disabled = true;
    try {
      const count = await store.countTombstones();
      if (cloud !== session) return;
      if (count === 0) {
        alert('삭제 기록이 없습니다.');
        return;
      }
      const kb = Math.max(1, Math.round(count * TOMBSTONE_BYTES / 1024));
      if (!confirm(`삭제 기록 ${count}개(약 ${kb}KB)가 있습니다. ${TOMBSTONE_KEEP_DAYS}일이 지난 기록을 비울까요?\n` +
        `(다른 기기에서 지운 북마크가 되살아나지 않도록 최근 ${TOMBSTONE_KEEP_DAYS}일 기록은 남깁니다.)`)) return;
      const removed = await store.purgeTombstones(Date.now() - TOMBSTONE_KEEP_DAYS * DAY_MS);
      if (cloud !== session) return;
      alert(removed > 0 ? `${removed}개를 비웠습니다.` : `${TOMBSTONE_KEEP_DAYS}일이 지난 삭제 기록이 없습니다.`);
    } catch (err) {
      console.error(err);
      if (cloud === session) alert(`삭제 기록을 확인하지 못했습니다. 연결된 뒤에 다시 시도해 주세요.\n(${err.code || err.message})`);
    } finally {
      button.disabled = false;
    }
  }

  function reportWriteError(err) {
    console.error(err);
    // 한 작업이 여러 배치로 나뉘어 실패해도 알림은 한 번만 띄운다.
    if (Date.now() - lastWriteErrorAt < 5000) return;
    lastWriteErrorAt = Date.now();
    alert(`클라우드에 저장하지 못했습니다. 화면의 변경이 되돌려질 수 있습니다.\n(${err.code || err.message})`);
  }

  // 경로 users/{uid}/bookmarks/{id}. 순서는 order 필드로 저장해 이동 한 번에 문서 하나만 쓴다 (D-020).
  // 계정 목록의 사본을 localStorage에 두고, 서버에서는 마지막으로 받은 뒤 바뀐 문서만 받는다 (D-025).
  // 사본은 "무엇을 보여 줄지", SDK의 IndexedDB 캐시는 "무엇을 올릴지"(앱을 닫아도 남는 오프라인 쓰기 대기열)를 맡는다.
  function createCloudStore(db, uid, copy) {
    const { fs } = firebase;
    const collectionRef = fs.collection(db, 'users', uid, 'bookmarks');
    const tombstoneQuery = fs.query(collectionRef, fs.where('deleted', '==', true));
    const copyKey = CLOUD_COPY_KEY_PREFIX + uid;
    const orders = copy ? copy.orders : new Map(); // id → order. 사본, 받은 문서, 내 쓰기로 갱신한다.
    // 받은 문서의 updatedAt 최댓값. 기기 시계가 틀려도 변경을 빠뜨리지 않도록 서버 시각만 쓴다.
    let lastSync = copy ? copy.lastSync : 0;
    let lastFullSync = copy ? copy.lastFullSync : 0; // 기기 시각. 전체 동기화 주기를 판단할 때만 쓴다
    let closed = false; // 로그아웃한 뒤 늦게 끝난 작업이 화면과 사본을 건드리지 않도록

    function docRef(id) {
      return fs.doc(collectionRef, String(id));
    }

    function toDoc(bm, order) {
      return { title: bm.title, url: bm.url, category: bm.category, addedAt: bm.addedAt, order, updatedAt: fs.serverTimestamp() };
    }

    // 삭제한 북마크. 다른 필드는 지운다 (setDoc은 문서 전체를 바꾼다).
    function tombstone() {
      return { deleted: true, updatedAt: fs.serverTimestamp() };
    }

    function minOrder() {
      return orders.size ? Math.min(...orders.values()) : 0;
    }

    function updatedAtOf(docSnap) {
      const time = docSnap.get('updatedAt');
      return time && typeof time.toMillis === 'function' ? time.toMillis() : 0;
    }

    // Firestore 문서도 외부 입력이다. 문서 ID와 맞지 않는 항목은 새 ID를 주면 문서와 어긋나므로 건너뛴다.
    function readDoc(docSnap) {
      const data = docSnap.data();
      const bm = normalizeBookmark({ ...data, id: docSnap.id });
      if (!bm || String(bm.id) !== docSnap.id || !Number.isFinite(data.order)) return null;
      return { bm, order: data.order };
    }

    // Firestore의 orderBy('order')와 같게, order가 같으면 문서 ID 순
    function sortByOrder(list) {
      return list.sort((a, b) => orders.get(a.id) - orders.get(b.id) ||
        (String(a.id) < String(b.id) ? -1 : String(a.id) > String(b.id) ? 1 : 0));
    }

    function saveCopy() {
      if (closed) return;
      try {
        localStorage.setItem(copyKey, JSON.stringify({
          version: CLOUD_COPY_VERSION, lastSync, lastFullSync,
          items: bookmarks.map(bm => ({ ...bm, order: orders.get(bm.id) }))
        }));
      } catch (err) {
        // 용량 초과 등. 알리지 않고, 남은 사본을 지워 다음에 열 때 전체를 받게 한다.
        console.warn('계정 목록의 사본을 저장하지 못했습니다.', err);
        localStorage.removeItem(copyKey);
      }
    }

    // 오프라인에서는 서버가 받을 때까지 끝나지 않으므로 기다리지 않고 오류만 받는다.
    // 거부되면 SDK는 자기 캐시만 되돌리므로, 서버의 그 문서를 다시 읽어 화면과 사본을 서버 값으로 맞춘다.
    // deleteWins: 다른 기기에서 지운 북마크(묘비 또는 문서 없음)를 고치거나 옮기면 규칙이 거부하는데(permission-denied),
    // 이때는 삭제가 이긴 것이므로 알리지 않는다 (D-020).
    function track(id, promise, deleteWins = false) {
      promise.catch(err => {
        if (closed) return;
        fs.getDocFromServer(docRef(id)).then(docSnap => {
          if (closed) return;
          const doc = docSnap.exists() && docSnap.get('deleted') !== true ? readDoc(docSnap) : null;
          const list = bookmarks.filter(bm => bm.id !== id);
          if (doc) {
            orders.set(id, doc.order);
            list.push(doc.bm);
          } else {
            orders.delete(id);
          }
          showCloudList(sortByOrder(list));
          saveCopy();
          if (!doc && deleteWins && (err.code === 'permission-denied' || err.code === 'not-found')) {
            console.warn('이미 삭제된 북마크라 변경을 버렸습니다.', err);
          } else {
            reportWriteError(err);
          }
        }).catch(() => reportWriteError(err));
      });
      watchPendingWrites();
    }

    // 여러 문서를 쓰다 거부되면 어느 문서가 어긋났는지 알 수 없으므로, 다음에 열 때 전체를 다시 받게 한다.
    function commitInBatches(ops, resyncOnError = true) {
      for (let i = 0; i < ops.length; i += MAX_BATCH_WRITES) {
        const batch = fs.writeBatch(db);
        ops.slice(i, i + MAX_BATCH_WRITES).forEach(op => op(batch));
        batch.commit().catch(err => {
          if (closed) return;
          if (resyncOnError) {
            lastFullSync = 0;
            saveCopy();
          }
          reportWriteError(err);
        });
      }
      watchPendingWrites();
    }

    function setAll(list, firstOrder) {
      return list.map((bm, i) => {
        const order = firstOrder + i * ORDER_GAP;
        orders.set(bm.id, order);
        return batch => batch.set(docRef(bm.id), toDoc(bm, order));
      });
    }

    // 이웃 간격이 너무 좁아지면 전체를 다시 매긴다 (드묾, 항목 수만큼 쓰기).
    function renumberAll() {
      orders.clear();
      commitInBatches(bookmarks.map((bm, i) => {
        orders.set(bm.id, i * ORDER_GAP);
        return batch => batch.update(docRef(bm.id), { order: i * ORDER_GAP, updatedAt: fs.serverTimestamp() });
      }));
    }

    return {
      saveCopy,

      close() {
        closed = true;
      },

      // 기기 시계가 뒤로 간 경우에도 멈추지 않도록 음수도 주기가 된 것으로 본다.
      isFullSyncDue() {
        const age = Date.now() - lastFullSync;
        return age < 0 || age >= FULL_SYNC_INTERVAL_DAYS * DAY_MS;
      },

      // 전체 받기. 묘비는 order가 없어 orderBy('order') 결과에 들어오지 않으므로 묘비가 쌓여도 읽기가 늘지 않는다.
      // 받는 동안 생긴 변경은 lastSync부터의 구독이 이어서 받는다.
      async fetchAll() {
        const snapshot = await withTimeout(fs.getDocsFromServer(fs.query(collectionRef, fs.orderBy('order'))), SERVER_FETCH_TIMEOUT_MS);
        const list = [];
        let newest = 0;
        orders.clear();
        snapshot.forEach(docSnap => {
          newest = Math.max(newest, updatedAtOf(docSnap));
          const doc = readDoc(docSnap);
          if (!doc) return;
          orders.set(doc.bm.id, doc.order);
          list.push(doc.bm);
        });
        lastSync = newest;
        lastFullSync = Date.now();
        return list;
      },

      // 서버에 닿지 못할 때 보여 줄 SDK 캐시의 목록. 편집은 막은 채로만 쓴다(orders는 건드리지 않음).
      async readCache() {
        const snapshot = await fs.getDocsFromCache(fs.query(collectionRef, fs.orderBy('order')));
        const list = [];
        snapshot.forEach(docSnap => {
          const doc = readDoc(docSnap);
          if (doc) list.push(doc.bm);
        });
        return list;
      },

      // 마지막으로 받은 뒤 바뀐 문서만. 같은 시각의 문서를 놓치지 않도록 >=로 받고, 다시 온 문서는 같은 내용으로 덮어쓴다.
      changesQuery() {
        return fs.query(collectionRef, fs.where('updatedAt', '>=', fs.Timestamp.fromMillis(lastSync)));
      },

      // 묘비는 삭제로, 나머지는 추가·교체로 합친다. 'removed'는 삭제가 아니다: 이 기기의 쓰기는 확정되기 전에
      // updatedAt(serverTimestamp)이 조건에 맞지 않아 결과에서 잠시 빠졌다가 확정되면 다시 온다. 확정 전의 쓰기도 그때 합친다.
      applyChanges(snapshot) {
        const byId = new Map(bookmarks.map(bm => [bm.id, bm]));
        snapshot.docChanges({ includeMetadataChanges: true }).forEach(({ type, doc: docSnap }) => {
          if (type === 'removed' || docSnap.metadata.hasPendingWrites) return;
          if (docSnap.get('deleted') === true) {
            byId.delete(Number(docSnap.id));
            orders.delete(Number(docSnap.id));
            return;
          }
          const doc = readDoc(docSnap);
          if (!doc) return;
          byId.set(doc.bm.id, doc.bm);
          orders.set(doc.bm.id, doc.order);
        });
        // 캐시에서 온 결과는 서버의 일부일 수 있어, 서버에서 온 결과로만 lastSync를 올린다.
        if (!snapshot.metadata.fromCache) {
          snapshot.forEach(docSnap => {
            if (!docSnap.metadata.hasPendingWrites) lastSync = Math.max(lastSync, updatedAtOf(docSnap));
          });
        }
        return sortByOrder([...byId.values()]);
      },

      // 묘비 수. 단일 조건이라 색인 설정 없이 되고, 묘비 1,000개당 읽기 1회.
      async countTombstones() {
        const snapshot = await withTimeout(fs.getCountFromServer(tombstoneQuery), SERVER_FETCH_TIMEOUT_MS);
        return snapshot.data().count;
      },

      // before(ms)보다 오래된 묘비만 지운다. 읽기·삭제가 묘비 수만큼 든다. 이미 지운 문서를 또 지워도 무해하다.
      async purgeTombstones(before) {
        const snapshot = await withTimeout(fs.getDocsFromServer(tombstoneQuery), SERVER_FETCH_TIMEOUT_MS);
        const old = snapshot.docs.filter(docSnap => updatedAtOf(docSnap) < before);
        commitInBatches(old.map(docSnap => batch => batch.delete(docSnap.ref)), false);
        return old.length;
      },

      add(item) {
        const order = minOrder() - ORDER_GAP;
        orders.set(item.id, order);
        track(item.id, fs.setDoc(docRef(item.id), toDoc(item, order)));
        saveCopy();
      },

      update(id, fields) {
        track(id, fs.updateDoc(docRef(id), { ...fields, updatedAt: fs.serverTimestamp() }), true);
        saveCopy();
      },

      // 문서를 지우면 바뀐 것만 받는 다른 기기가 삭제를 알 수 없으므로 묘비로 바꾼다 (D-025).
      remove(id) {
        orders.delete(id);
        track(id, fs.setDoc(docRef(id), tombstone()), true);
        saveCopy();
      },

      // 옮긴 자리의 앞뒤 이웃 order 사이 값을 준다.
      move(id, toIndex) {
        const before = toIndex > 0 ? orders.get(bookmarks[toIndex - 1].id) : undefined;
        const after = toIndex < bookmarks.length - 1 ? orders.get(bookmarks[toIndex + 1].id) : undefined;
        let order = 0;
        if (before !== undefined && after !== undefined) {
          if (!(after - before > MIN_ORDER_GAP)) {
            renumberAll();
            saveCopy();
            return;
          }
          order = (before + after) / 2;
        } else if (after !== undefined) {
          order = after - ORDER_GAP;
        } else if (before !== undefined) {
          order = before + ORDER_GAP;
        }
        orders.set(id, order);
        track(id, fs.updateDoc(docRef(id), { order, updatedAt: fs.serverTimestamp() }), true);
        saveCopy();
      },

      // 덮어쓰기: 새 목록에 없는 문서는 묘비로 바꾸고 나머지는 새로 쓴다.
      replaceAll(list) {
        const keep = new Set(list.map(bm => bm.id));
        const deletes = [...orders.keys()].filter(id => !keep.has(id)).map(id => batch => batch.set(docRef(id), tombstone()));
        orders.clear();
        commitInBatches([...deletes, ...setAll(list, 0)]);
        saveCopy();
      },

      mergeAll(list) {
        commitInBatches(setAll(list, minOrder() - ORDER_GAP * list.length));
        saveCopy();
      }
    };
  }

  /* ------------------- 다크 모드 ------------------- */
  // 사용자가 직접 전환하기 전에는 테마를 저장하지 않고 OS 설정을 계속 따른다.
  function getSavedTheme() {
    const savedTheme = localStorage.getItem(THEME_KEY);
    return savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : null;
  }

  function initTheme() {
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    applyTheme(getSavedTheme() || (darkQuery.matches ? 'dark' : 'light'));
    darkQuery.addEventListener('change', (e) => {
      if (!getSavedTheme()) applyTheme(e.matches ? 'dark' : 'light');
    });
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeToggleBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(nextTheme);
    localStorage.setItem(THEME_KEY, nextTheme);
  }

  /* ---------------- 파비콘 및 렌더링 ---------------- */
  function getFaviconUrl(url) {
    try {
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    } catch {
      return '';
    }
  }

  function getVisibleBookmarks() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const catFilter = document.getElementById('categoryFilter').value;

    return bookmarks.filter(bm => {
      const matchSearch = bm.title.toLowerCase().includes(search) || bm.url.toLowerCase().includes(search);
      const matchCat = catFilter === 'all' || bm.category === catFilter;
      return matchSearch && matchCat;
    });
  }

  function renderBookmarks() {
    const grid = document.getElementById('bookmarkGrid');

    // 필터링 전에 갱신해야 사라진 카테고리가 선택된 채로 남지 않는다 (없으면 '전체'로 돌아감)
    updateCategoryOptions();
    const filtered = getVisibleBookmarks();

    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 48px 0;">${cloudLoading && bookmarks.length === 0 ? '계정 목록을 불러오는 중…' : '북마크가 없습니다.'}</p>`;
      return;
    }

    // 계정이 준비되기 전(사본을 보이는 중)에는 보기·검색·내보내기만 된다 (D-025).
    const locked = cloudLoading;
    filtered.forEach((bm, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('draggable', String(!locked));
      card.dataset.id = bm.id;

      card.innerHTML = `
        <div>
          <div class="card-top">
            <span class="drag-handle" title="드래그하여 순서 변경">⋮⋮</span>
            <img class="favicon" src="${escapeHtml(getFaviconUrl(bm.url))}" onerror="this.style.display='none'" alt="">
            <div class="title-wrapper">
              <a href="${escapeHtml(bm.url)}" target="_blank" rel="noopener noreferrer" class="card-title" title="${escapeHtml(bm.title)}">${escapeHtml(bm.title)}</a>
            </div>
          </div>
          <div class="card-url" title="${escapeHtml(bm.url)}">${escapeHtml(bm.url)}</div>
          ${bm.category ? `<span class="badge">${escapeHtml(bm.category)}</span>` : ''}
        </div>
        <div class="card-actions">
          <div class="move-group">
            <button class="btn-outline btn-action" data-action="move-prev" title="앞으로 이동" aria-label="앞으로 이동" ${locked || index === 0 ? 'disabled' : ''}>←</button>
            <button class="btn-outline btn-action" data-action="move-next" title="뒤로 이동" aria-label="뒤로 이동" ${locked || index === filtered.length - 1 ? 'disabled' : ''}>→</button>
          </div>
          <button class="btn-outline btn-action" data-action="edit" ${locked ? 'disabled' : ''}>수정</button>
          <button class="btn-delete btn-action" data-action="delete" ${locked ? 'disabled' : ''}>삭제</button>
        </div>
      `;

      // 데이터 값이 코드로 해석되지 않도록 인라인 onclick 대신 클로저로 연결
      card.querySelector('[data-action="move-prev"]').addEventListener('click', () => moveBookmarkBy(bm.id, -1));
      card.querySelector('[data-action="move-next"]').addEventListener('click', () => moveBookmarkBy(bm.id, 1));
      card.querySelector('[data-action="edit"]').addEventListener('click', () => editBookmark(bm.id));
      card.querySelector('[data-action="delete"]').addEventListener('click', () => deleteBookmark(bm.id));

      // 드래그 앤 드롭 이벤트 연결
      setupDragEvents(card);
      grid.appendChild(card);
    });
  }

  /* ---------------- 드래그 앤 드롭 ---------------- */
  let draggedId = null;

  function setupDragEvents(card) {
    card.addEventListener('dragstart', (e) => {
      draggedId = Number(card.dataset.id);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });

    card.addEventListener('dragover', (e) => {
      e.preventDefault(); // 필수: drop 허용
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });

    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = Number(card.dataset.id);

      if (draggedId && draggedId !== targetId) {
        const toIndex = bookmarks.findIndex(b => b.id === targetId);
        if (toIndex !== -1) moveBookmark(draggedId, toIndex);
      }
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
      draggedId = null;
    });
  }

  // 드래그를 쓸 수 없는 터치·키보드용. 화면에 보이는(필터된) 이웃 카드 자리로 옮긴다.
  function moveBookmarkBy(id, direction) {
    const visible = getVisibleBookmarks();
    const neighbor = visible[visible.findIndex(bm => bm.id === id) + direction];
    if (!neighbor) return;

    moveBookmark(id, bookmarks.findIndex(bm => bm.id === neighbor.id));

    // 다시 그리면 포커스가 사라지므로 옮긴 카드의 버튼으로 되돌려 연속 이동을 가능하게 한다.
    const card = document.querySelector(`.card[data-id="${id}"]`);
    const button = card && (card.querySelector(`[data-action="${direction < 0 ? 'move-prev' : 'move-next'}"]:not(:disabled)`) ||
      card.querySelector('.move-group button:not(:disabled)'));
    if (button) button.focus();
  }

  /* ------------- 카테고리 필터 관리 ------------- */
  function updateCategoryOptions() {
    const select = document.getElementById('categoryFilter');
    const currentVal = select.value;
    const categories = Array.from(new Set(bookmarks.map(bm => bm.category).filter(Boolean)));

    select.innerHTML = '<option value="all">전체 카테고리</option>';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      if (cat === currentVal) opt.selected = true;
      select.appendChild(opt);
    });
  }

  /* ---------------- 모달 및 CRUD ---------------- */
  function openModal(isEdit = false) {
    document.getElementById('modalTitle').textContent = isEdit ? '북마크 수정' : '새 북마크 추가';
    document.getElementById('modalOverlay').style.display = 'flex';
    document.getElementById('bmTitle').focus();
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
    document.getElementById('editId').value = '';
    document.getElementById('bmTitle').value = '';
    document.getElementById('bmUrl').value = '';
    document.getElementById('bmCategory').value = '';
  }

  function handleOverlayClick(e) {
    if (e.target.id === 'modalOverlay') closeModal();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').style.display === 'flex') closeModal();
  });

  // Enter 저장은 <form>의 submit으로 처리된다.
  function saveBookmark() {
    const id = Number(document.getElementById('editId').value);
    const title = truncateText(document.getElementById('bmTitle').value.trim(), MAX_TITLE_LENGTH);
    let url = document.getElementById('bmUrl').value.trim();
    const category = truncateText(document.getElementById('bmCategory').value.trim(), MAX_CATEGORY_LENGTH);

    if (!title || !url) {
      alert('제목과 주소(URL)를 입력해주세요.');
      return;
    }

    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }

    if (!isSafeUrl(url)) {
      alert('올바른 웹 주소(URL)가 아닙니다.');
      return;
    }

    if (url.length > MAX_URL_LENGTH) {
      alert(`웹 주소가 너무 깁니다. (${MAX_URL_LENGTH}자 이하)`);
      return;
    }

    if (id) {
      updateBookmark(id, { title, url, category });
    } else {
      addBookmark({ id: generateId(maxId(bookmarks)), title, url, category, addedAt: Date.now() });
    }
    closeModal();
  }

  function editBookmark(id) {
    const item = bookmarks.find(bm => bm.id === id);
    if (!item) return;

    document.getElementById('editId').value = item.id;
    document.getElementById('bmTitle').value = item.title;
    document.getElementById('bmUrl').value = item.url;
    document.getElementById('bmCategory').value = item.category || '';
    openModal(true);
  }

  function deleteBookmark(id) {
    if (!confirm('이 북마크를 삭제하시겠습니까?')) return;
    removeBookmark(id);
  }

  /* ------------ HTML 북마크 내보내기 (표준 규격) ------------ */
  // 카테고리 없는 북마크를 넣는 폴더. 가져올 때는 카테고리 없음으로 되돌린다 (D-024).
  const EXPORT_DEFAULT_FOLDER = '기본 북마크';
  // 이 앱이 내보낸 파일 표시. 브라우저는 무시하고, 가져올 때 폴더를 모두 카테고리로 읽게 한다 (D-024).
  const EXPORT_GENERATOR = 'jdrbmmanager';

  function exportHTML() {
    const now = Math.floor(Date.now() / 1000);
    
    // Netscape Bookmark File 포맷 빌드
    let htmlContent = `<!DOCTYPE NETSCAPE-Bookmark-file-1>
<!-- This is an automatically generated file.
     It will be read and overwritten.
     DO NOT EDIT! -->
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<META NAME="generator" CONTENT="${EXPORT_GENERATOR}">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>
<DL><p>\n`;

    // 카테고리별로 그룹화
    const groups = {};
    bookmarks.forEach(bm => {
      const cat = bm.category || EXPORT_DEFAULT_FOLDER;
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(bm);
    });

    // 폴더는 앱에 없는 개념이라 내보낸 시각을 쓰고, 북마크는 추가 시각을 알 때만 ADD_DATE를 넣는다.
    for (const [category, items] of Object.entries(groups)) {
      htmlContent += `    <DT><H3 ADD_DATE="${now}" LAST_MODIFIED="${now}">${escapeHtml(category)}</H3>\n    <DL><p>\n`;
      items.forEach(bm => {
        const addDate = bm.addedAt ? ` ADD_DATE="${Math.floor(bm.addedAt / 1000)}"` : '';
        htmlContent += `        <DT><A HREF="${escapeHtml(bm.url)}"${addDate}>${escapeHtml(bm.title)}</A>\n`;
      });
      htmlContent += `    </DL><p>\n`;
    }

    htmlContent += `</DL><p>\n`;

    downloadFile(htmlContent, 'text/html;charset=utf-8', `bookmarks_${new Date().toISOString().slice(0, 10)}.html`);
  }

  function downloadFile(content, type, filename) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  /* ------------ JSON 백업 / 복구 ------------ */
  function exportJSON() {
    downloadFile(JSON.stringify(bookmarks, null, 2), 'application/json',
      `bookmarks_backup_${new Date().toISOString().slice(0, 10)}.json`);
  }

  // [📂 가져오기] 하나로 JSON 백업과 브라우저 북마크 HTML을 모두 받고, 내용으로 형식을 가린다 (D-024).
  function importJSON(event) {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    // 읽기 전에 거절한다 (폰 메모리 보호).
    if (file.size > MAX_IMPORT_FILE_BYTES) {
      alert(`파일이 너무 큽니다. (${MAX_IMPORT_FILE_BYTES / 1024 / 1024}MB 이하)`);
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        if (isBookmarkHtml(file, e.target.result)) {
          importBrowserBookmarks(e.target.result);
          return;
        }

        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) {
          alert('올바른 JSON 데이터 형식이 아닙니다.');
          return;
        }

        let valid = sanitizeBookmarks(imported);
        if (valid.length === 0) {
          alert('불러올 수 있는 북마크가 없습니다.\n(제목과 http/https 주소가 있는 항목만 불러옵니다.)');
          return;
        }

        if (confirm('기존 데이터를 덮어쓰시겠습니까?\n[확인] 전체 덮어쓰기 / [취소] 기존 목록에 병합')) {
          replaceAll(valid);
        } else {
          // 병합할 때만 기존 ID와 겹치는 항목에 새 ID를 준다.
          valid = sanitizeBookmarks(imported, bookmarks);
          mergeAll(valid);
        }

        const skipped = imported.length - valid.length;
        alert(`북마크 ${valid.length}개를 불러왔습니다.` +
          (skipped > 0 ? `\n형식이 잘못된 ${skipped}개 항목은 건너뛰었습니다.` : ''));
      } catch (err) {
        alert('파일을 읽는 도중 오류가 발생했습니다.');
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  /* ------------ 브라우저 북마크 가져오기 ------------ */
  // 크롬·엣지·파이어폭스와 이 앱의 exportHTML이 쓰는 Netscape 북마크 HTML을 읽는다 (D-024).
  const MAX_IMPORT_FILE_BYTES = 20 * 1024 * 1024;
  // 브라우저가 만든 최상위 폴더. 사용자가 고른 분류가 아니므로 카테고리로 쓰지 않는다.
  const BROWSER_ROOT_FOLDERS = new Set([
    '북마크바', '북마크 바', '기타 북마크', '모바일 북마크', '북마크 도구 모음', '북마크 메뉴',
    'Bookmarks bar', 'Bookmarks Bar', 'Other bookmarks', 'Other Bookmarks', 'Mobile bookmarks', 'Bookmarks Toolbar', 'Bookmarks Menu'
  ]);

  // 파일 이름보다 내용을 먼저 본다. 확장자를 바꾼 파일도 받기 위함.
  function isBookmarkHtml(file, text) {
    return /^\s*<!DOCTYPE\s+NETSCAPE-Bookmark-file-1/i.test(text) || /\.html?$/i.test(file.name);
  }

  // 폴더 = <DT> 안의 <H3> + 바로 뒤의 <DL>. 바깥 폴더부터 담는다.
  function folderPath(a) {
    const path = [];
    for (let dl = a.closest('dl'); dl; dl = dl.parentElement && dl.parentElement.closest('dl')) {
      const dt = dl.parentElement && dl.parentElement.tagName === 'DT' ? dl.parentElement : null;
      const h3 = dt ? dt.querySelector(':scope > h3') : null;
      if (h3) path.unshift(h3);
    }
    return path;
  }

  // 중첩 폴더는 가장 안쪽 폴더 이름만 쓴다 (앱에는 폴더가 없음).
  // 이 앱이 내보낸 파일의 폴더는 모두 카테고리이므로, 브라우저 최상위 폴더와 이름이 같아도 빼지 않는다.
  function folderCategory(a, fromThisApp) {
    const names = folderPath(a)
      .filter((h3, i) => fromThisApp || (!h3.hasAttribute('personal_toolbar_folder') && !h3.hasAttribute('unfiled_bookmarks_folder')
        && !(i === 0 && BROWSER_ROOT_FOLDERS.has(h3.textContent.trim()))))
      .map(h3 => h3.textContent.trim())
      .filter(name => name && name !== EXPORT_DEFAULT_FOLDER);
    return names.length ? names[names.length - 1] : '';
  }

  // ADD_DATE는 초 단위지만, ms·µs로 적는 도구도 있어 자릿수로 맞춘다.
  function parseAddDate(value) {
    const time = Number(value);
    if (!value || !Number.isFinite(time)) return null;
    const ms = Math.round(time >= 1e14 ? time / 1000 : time >= 1e11 ? time : time * 1000);
    return isPlausibleTime(ms) ? ms : null;
  }

  function hostnameOf(url) {
    try {
      return new URL(url).hostname;
    } catch {
      return '';
    }
  }

  // 같은 주소인지 가리는 키. 호스트 대소문자·기본 포트·호스트만 있는 주소의 끝 '/'만 같게 본다.
  function urlKey(url) {
    try {
      return new URL(url).href;
    } catch {
      return url;
    }
  }

  // DOMParser로 만든 문서는 화면에 붙지 않아 스크립트가 실행되지 않고 이미지도 받지 않는다.
  // 값은 textContent·getAttribute로만 꺼내고 normalizeBookmark로 검증한다 (D-014).
  function parseBrowserBookmarks(text) {
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const fromThisApp = [...doc.querySelectorAll('meta[name="generator"]')].some(meta => meta.getAttribute('content') === EXPORT_GENERATOR);
    const items = [];
    let invalid = 0;
    doc.querySelectorAll('a[href]').forEach(a => {
      const url = a.getAttribute('href').trim();
      const item = normalizeBookmark({
        title: a.textContent.trim() || hostnameOf(url),
        url,
        category: folderCategory(a, fromThisApp),
        addedAt: parseAddDate(a.getAttribute('add_date'))
      });
      if (item) items.push(item);
      else invalid++;
    });
    return { items, invalid };
  }

  // 병합만 한다. 지금 목록에 있거나 파일 안에서 앞에 나온 주소는 건너뛴다.
  function importBrowserBookmarks(text) {
    const { items, invalid } = parseBrowserBookmarks(text);
    const seen = new Set(bookmarks.map(bm => urlKey(bm.url)));
    const fresh = items.filter(bm => {
      const key = urlKey(bm.url);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    const skipped = [];
    if (items.length > fresh.length) skipped.push(`이미 있는 주소 ${items.length - fresh.length}개`);
    if (invalid > 0) skipped.push(`가져올 수 없는 항목 ${invalid}개`);

    if (fresh.length === 0) {
      alert(skipped.length
        ? `새로 가져올 북마크가 없습니다.\n(${skipped.join(', ')})`
        : '가져올 북마크가 없습니다.\n(브라우저에서 내보낸 북마크 HTML 파일인지 확인해 주세요.)');
      return;
    }
    if (!confirm(`북마크 ${fresh.length}개를 가져올까요?` + (skipped.length ? `\n(${skipped.join(', ')}는 건너뜁니다.)` : ''))) return;

    mergeAll(sanitizeBookmarks(fresh, bookmarks));
    alert(`북마크 ${fresh.length}개를 가져왔습니다.`);
  }

  // 초기화 실행
  initTheme();
  setCloudLoading(cloudLoading, bootCopy !== null);
  renderBookmarks();
  initCloud();
  window.addEventListener('online', updateSyncStatus);
  window.addEventListener('offline', updateSyncStatus);

  // 오프라인에서도 앱이 열리도록 (https와 localhost에서만 가능. file://에는 serviceWorker가 없음)
  if ('serviceWorker' in navigator && isServedOverHttp()) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('서비스 워커를 등록하지 못했습니다.', err));
  }
</script>
</body>
</html>
